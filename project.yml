name: MacPower
options:
  bundleIdPrefix: app.macpower
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: H6AYG25QVN
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    COMBINE_HIDPI_IMAGES: YES
    DEAD_CODE_STRIPPING: YES
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  MacPower:
    type: application
    platform: macOS
    sources:
      - path: MacPower
      - path: AppIcon.icon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.macpower.MacPower
        PRODUCT_NAME: MacPower
        INFOPLIST_FILE: MacPower/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: MacPower/MacPower.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        SKIP_INSTALL: NO
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
    scheme:
      testTargets:
        - MacPowerTests

  MacPowerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MacPowerTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.macpower.MacPowerTests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MacPower.app/Contents/MacOS/MacPower"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: MacPower
